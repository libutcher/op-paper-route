<!--
  PaperRoute app icon: the line-drawn paper plane, in white, on an ink-blue
  rounded-square tile laid out on Apple's 1024×1024 macOS icon grid (an
  824×824 tile inset 100px, with room for the system's shadow).
  Rendered to build/PaperRoute.icns by scripts/render-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a74c4"/>
      <stop offset="1" stop-color="#1f4e8c"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tile)"/>
  <!-- The 24-unit plane, scaled 23× and centred on the tile. -->
  <g transform="translate(512 512) scale(23) translate(-12.25 -11.85)" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M21.5 3.5 L3 10.6 L9.6 13.2 L12.6 20.2 Z"/>
    <path d="M21.5 3.5 L9.6 13.2"/>
  </g>
</svg>
