<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only our own script and styles; no inline code, no network. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Paper Route</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="renderer.js"></script>
  </head>
  <body>
    <!-- First run: which 1Password account to use. -->
    <form id="account-view" class="view" hidden>
      <h1>Paper Route</h1>
      <p class="hint">Which 1Password account should documents go to? Use the name shown at the top of the 1Password sidebar.</p>
      <label for="account-name">Account name</label>
      <input id="account-name" type="text" autocomplete="off" required />
      <button type="submit" class="primary">Continue</button>
      <p id="account-error" class="status error" role="alert"></p>
    </form>

    <!-- Everyday view: drop, check, Return. -->
    <form id="save-view" class="view" hidden>
      <div id="drop" class="drop" tabindex="0" role="button" aria-describedby="drop-hint">
        <div id="drop-empty">
          <strong>Drop a document here</strong>
          <span id="drop-hint" class="hint">or <button type="button" id="choose" class="link">choose a file…</button></span>
        </div>
        <div id="drop-file" hidden>
          <strong id="file-name"></strong>
          <button type="button" id="clear-file" class="link">Remove</button>
        </div>
      </div>

      <label for="title">Title</label>
      <input id="title" type="text" autocomplete="off" placeholder="Uses the file name if left blank" />

      <label for="vault">Vault</label>
      <select id="vault" disabled>
        <option>Loading vaults…</option>
      </select>

      <div class="actions">
        <button type="submit" id="save" class="primary" disabled>Save to 1Password</button>
        <span class="hint keys">Return to save · Esc to hide · Control-Option-P to reopen</span>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="status-actions" class="actions" hidden></div>
    </form>
  </body>
</html>
